services:
  sales:
    build:
      context: ..
      dockerfile: sales-gateway/Dockerfile
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      SALES_HOST: 0.0.0.0
      SALES_HOST_KIND: PERMANENT_SERVER
      OLLAMA_INTERNAL_URL: http://ollama:11434
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1g
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    depends_on: [ollama]
    networks: [outbound, inference]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  ollama:
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    volumes: [models:/root/.ollama]
    environment:
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_MAX_LOADED_MODELS: 1
    mem_limit: 4g
    networks: [inference, outbound]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "2"}
volumes:
  models:
networks:
  outbound:
  inference:
    internal: true
